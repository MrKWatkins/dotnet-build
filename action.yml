name: .NET Build
description: "Builds a .NET solution."
inputs:
  directory:
    description: "Directory containing the solution."
    required: false
    default: "."
  name:
    description: "Name of the solution, used in the name for the coverage summary."
    required: false
    default: ""
  coverage:
    description: "Collect coverage and generate coverage reports. Enabled by default."
    required: false
    default: "true"
  coverage-assembly-filters:
    description: "Optional filter to apply when merging code coverage reports."
    required: false
    default: ""
  dotnet-version:
    description: ".NET version to use. Defaults to 10.0.x."
    required: false
    default: "10.0.x"

runs:
  using: composite

  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore Dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: dotnet restore

    - name: Verify Code Is Correctly Formatted
      continue-on-error: true
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: dotnet format --verify-no-changes

    - name: Build
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: dotnet build --no-restore --configuration Release

    - name: Test
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        COLLECT_COVERAGE: ${{ inputs.coverage }}
      run: |
        arguments=(--no-restore --no-build --configuration Release)
        if [[ "$COLLECT_COVERAGE" == "true" ]]; then
          arguments+=(--coverage --coverage-output-format cobertura)
        fi
        dotnet test "${arguments[@]}"

    - name: Merge Code Coverage Reports
      if: ${{ (success() || failure()) && inputs.coverage == 'true' }}
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: |
        dotnet new tool-manifest
        dotnet tool install dotnet-reportgenerator-globaltool
        dotnet tool run reportgenerator "-reports:**/TestResults/**/*.cobertura.xml" "-targetdir:." "-reportTypes:Cobertura"${{ inputs.coverage-assembly-filters != '' && format(' -assemblyfilters:{0}', inputs.coverage-assembly-filters) || '' }}
        
    - name: Generate Code Coverage Summary
      if: ${{ inputs.coverage == 'true' }}
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.directory }}/Cobertura.xml
        format: markdown
        indicators: true
        output: file
        thresholds: '80 90'

      # Perform last in case they fail for being too big at some point.
    - name: Add Code Coverage Summary to Job Summary
      if: ${{ inputs.coverage == 'true' }}
      shell: bash
      run: |
        echo "# ${{ inputs.name }} Coverage Report" >> $GITHUB_STEP_SUMMARY
        cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
